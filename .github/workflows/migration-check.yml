name: Database Migration Validation

on:
    pull_request:
        paths:
            - "migrations/**"

jobs:
    validate-migrations:
        name: Validate Migration Up & Down
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: admin
                    POSTGRES_PASSWORD: admin
                    POSTGRES_DB: loanflow_migration_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - uses: actions/checkout@v4

            - name: Install golang-migrate
              run: |
                  curl -L https://github.com/golang-migrate/migrate/releases/download/v4.17.0/migrate.linux-amd64.tar.gz | tar xvz
                  sudo mv migrate /usr/local/bin/

            - name: Test Migration UP
              run: |
                  migrate -path migrations -database "postgres://admin:admin@localhost:5432/loanflow_migration_test?sslmode=disable" up

            - name: Test Migration DOWN (Reversibility Check)
              run: |
                  migrate -path migrations -database "postgres://admin:admin@localhost:5432/loanflow_migration_test?sslmode=disable" down -all
