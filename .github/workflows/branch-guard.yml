name: Branch Protection Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  validate-branch:
    name: Validate PR Source & Target Branches
    runs-on: ubuntu-latest
    steps:
      - name: Validate Target Branches
        run: |
          TARGET_BRANCH="${{ github.base_ref }}"
          SOURCE_BRANCH="${{ github.head_ref }}"

          echo "Target branch: $TARGET_BRANCH"
          echo "Source branch: $SOURCE_BRANCH"

          # Rule 1: PRs targeting 'main' MUST originate from 'develop'
          if [ "$TARGET_BRANCH" = "main" ] && [ "$SOURCE_BRANCH" != "develop" ]; then
            echo "::error::Pull Requests to 'main' are only allowed from 'develop'. Branch '$SOURCE_BRANCH' is not allowed."
            exit 1
          fi

          # Rule 2: Non-main PRs must target 'develop'
          if [ "$TARGET_BRANCH" != "main" ] && [ "$TARGET_BRANCH" != "develop" ]; then
            echo "::error::Pull Requests can only target 'develop' (or 'main' from 'develop'). Target '$TARGET_BRANCH' is invalid."
            exit 1
          fi

          echo "Branch targeting validation passed!"