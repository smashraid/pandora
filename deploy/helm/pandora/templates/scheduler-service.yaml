apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-scheduler
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.scheduler.httpPort }}
      targetPort: http
    - name: grpc
      port: {{ .Values.scheduler.grpcPort }}
      targetPort: grpc
  selector:
    app.kubernetes.io/component: scheduler